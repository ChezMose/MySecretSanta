# Compile l'APK signé à chaque push sur main et le publie dans la release « dev ».
# Lien de téléchargement stable, à ouvrir sur le téléphone :
#   https://github.com/ChezMose/MySecretSanta/releases/download/dev/MySecretSanta.apk
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets KEYSTORE_BASE64 et KEYSTORE_PASSWORD manquants."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "SIGNING_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Tester et compiler l'APK
        run: gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk MySecretSanta.apk

      - uses: actions/upload-artifact@v7
        with:
          name: MySecretSanta-${{ github.run_number }}
          path: MySecretSanta.apk

      - name: Publier dans la release « dev »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev MySecretSanta.apk \
            --target "$GITHUB_SHA" \
            --title "Version de développement (build ${{ github.run_number }})" \
            --notes "APK compilé depuis le commit $GITHUB_SHA."
